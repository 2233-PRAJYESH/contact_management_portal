- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.12"

- name: Install dependencies
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pylint

- name: Run Pylint
  run: pylint $(git ls-files '*.py')

- name: Debug Python dependencies
  run: |
    python --version
    python -m pip show Flask Flask-WTF python-dotenv
    python -c "import flask, flask_wtf, dotenv; print('Imports successful')"
    python -m pylint --version
