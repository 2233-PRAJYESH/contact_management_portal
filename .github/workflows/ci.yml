
name: Pylint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pylint

      - name: Check Python imports
        run: |
          python -m pip show Flask Flask-WTF python-dotenv
          python -c "import flask, flask_wtf, dotenv, mysql.connector,authlib; print('Imports successful')"

      - name: Analyse code with Pylint
        run: python -m pylint --disable=missing-module-docstring,missing-function-docstring,missing-class-docstring,missing-final-newline,trailing-whitespace,trailing-newlines,wrong-import-order,wrong-import-position,unspecified-encoding $(git ls-files '*.py')
