services:

  app:
    build:
      context: .

    container_name: contact-portal
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}


    depends_on:
      - mysql

    volumes:
      - .:/app

    networks:
      - contact-network

  mysql:
    image: mysql:8.0
    container_name: contact-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3308:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - contact-network

volumes:
  mysql-data:

networks:
  contact-network: